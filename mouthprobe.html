<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>嘴部定位探针</title>
<style>
  html,body{margin:0;background:#0d0d0f;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="cv" width="1200" height="1200"></canvas>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js'
import { sampleMeshToPoints } from '/src/scene/sampleMesh.js'

const Q = new URLSearchParams(location.search)
const num = (k, d) => (Q.has(k) ? Number(Q.get(k)) : d)
const MODE = Q.get('mode') || 'ramp'   // ramp | hill
const GRID = num('grid', 0.1)          // 网格步长，0 = 不画

const W = 1200, H = 1200
const PAD = 70
const cv = document.getElementById('cv')
const ctx = cv.getContext('2d', { willReadFrequently: true })

const loader = new GLTFLoader()
loader.setMeshoptDecoder(MeshoptDecoder)
const gltf = await loader.loadAsync('/src/assets/mask.glb')

const geo = await sampleMeshToPoints(gltf.scene, 220000)
const pos = geo.getAttribute('position')
const nrm = geo.getAttribute('aNorm')
const n = pos.count

// 正面点筛选
const front = []
for (let i = 0; i < n; i++) if (nrm.getZ(i) > 0.10) front.push(i)

let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, minZ = 1e9, maxZ = -1e9
for (const i of front) {
  const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i)
  if (x < minX) minX = x; if (x > maxX) maxX = x
  if (y < minY) minY = y; if (y > maxY) maxY = y
  if (z < minZ) minZ = z; if (z > maxZ) maxZ = z
}

const gx0 = num('x0', Math.min(minX, -0.5)), gx1 = num('x1', Math.max(maxX, 0.5))
const gy0 = num('y0', Math.min(minY, -0.5)), gy1 = num('y1', Math.max(maxY, 0.5))
const gw = gx1 - gx0, gh = gy1 - gy0
const sc = Math.min((W - 2 * PAD) / gw, (H - 2 * PAD) / gh)
const ox = W / 2 - ((gx0 + gx1) / 2) * sc
const oy = H / 2 + ((gy0 + gy1) / 2) * sc
const toPx = (x, y) => [ox + x * sc, oy - y * sc]

// 高度缓冲：每像素保留最大 z（最靠前的表面）
const hb = new Float32Array(W * H).fill(-Infinity)
const D = ctx.createImageData(W, H).data
for (const i of front) {
  const px = Math.round(toPx(pos.getX(i), pos.getY(i))[0])
  const py = Math.round(toPx(pos.getX(i), pos.getY(i))[1])
  if (px < 0 || px >= W || py < 0 || py >= H) continue
  const q = py * W + px
  const z = pos.getZ(i)
  if (z > hb[q]) hb[q] = z
}

// 孔洞填充：向外扩散 3 圈，避免阴影图上出现锯齿状空洞
for (let pass = 0; pass < 3; pass++) {
  const src = Float32Array.from(hb)
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const q = y * W + x
      if (src[q] > -Infinity) continue
      let best = -Infinity
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const v = src[q + dy * W + dx]
        if (v > best) best = v
      }
      if (best > -Infinity) hb[q] = best
    }
  }
}

const RAMP = [
  [0.00, [24, 32, 92]], [0.22, [30, 110, 190]], [0.45, [120, 220, 235]],
  [0.62, [235, 240, 220]], [0.80, [246, 168, 58]], [1.00, [200, 46, 32]]
]
function ramp(t) {
  t = Math.min(1, Math.max(0, t))
  for (let k = 1; k < RAMP.length; k++) {
    if (t <= RAMP[k][0]) {
      const [t0, c0] = RAMP[k - 1], [t1, c1] = RAMP[k]
      const f = (t - t0) / (t1 - t0)
      return [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f]
    }
  }
  return RAMP[RAMP.length - 1][1]
}

// 可分离盒式模糊：点云每像素只有一个样本，直接求梯度全是颗粒噪声，
// 必须先抹平再算坡度，否则山体阴影只是一层雪花
const BLUR = num('blur', 4)
let HS = hb
for (let pass = 0; pass < 2; pass++) {
  const tmp = new Float32Array(W * H)
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      let s = 0, c = 0
      for (let d = -BLUR; d <= BLUR; d++) {
        const xx = x + d
        if (xx < 0 || xx >= W) continue
        const v = HS[y * W + xx]
        if (v === -Infinity) continue
        s += v; c++
      }
      tmp[y * W + x] = c ? s / c : -Infinity
    }
  }
  const tmp2 = new Float32Array(W * H)
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      let s = 0, c = 0
      for (let d = -BLUR; d <= BLUR; d++) {
        const yy = y + d
        if (yy < 0 || yy >= H) continue
        const v = tmp[yy * W + x]
        if (v === -Infinity) continue
        s += v; c++
      }
      tmp2[y * W + x] = c ? s / c : -Infinity
    }
  }
  HS = tmp2
}

const zr = Math.max(1e-6, maxZ - minZ)
// 光照方向：左上打光，右下方出阴影，浮雕感最强
const LX = -0.62, LY = 0.62
const NL = Math.hypot(LX, LY, 1)
for (let y = 1; y < H - 1; y++) {
  for (let x = 1; x < W - 1; x++) {
    const q = y * W + x
    if (HS[q] === -Infinity) continue
    const r = HS[q + 1], l = HS[q - 1], u = HS[q - W], d = HS[q + W]
    let c
    if (MODE === 'hill') {
      const hR = r > -Infinity ? r : HS[q], hL = l > -Infinity ? l : HS[q]
      const hU = u > -Infinity ? u : HS[q], hD = d > -Infinity ? d : HS[q]
      // 把 z 差放大成坡度，纯黑白打光图
      const K = sc * 0.55
      const nx = -(hR - hL) * K, ny = (hU - hD) * K
      const nl = Math.hypot(nx, ny, 1)
      let lam = (nx * LX + ny * LY + 1) / (nl * NL)
      lam = Math.max(0, Math.min(1, lam * 1.25))
      const v = Math.round(255 * (0.10 + 0.95 * lam))
      c = [v * 0.98, v * 0.94, v * 0.86]
    } else {
      c = ramp((HS[q] - minZ) / zr)
      const nmx = -(r - l) * sc * 0.4, nmy = (u - d) * sc * 0.4
      const nml = Math.hypot(nmx, nmy, 1)
      const lam = Math.max(0, Math.min(1, (nmx * LX + nmy * LY + 1) / (nml * NL) * 1.2))
      c = [c[0] * (0.55 + 0.55 * lam), c[1] * (0.55 + 0.55 * lam), c[2] * (0.55 + 0.55 * lam)]
    }
    const k = q * 4
    D[k] = c[0]; D[k + 1] = c[1]; D[k + 2] = c[2]; D[k + 3] = 255
  }
}
ctx.putImageData(new ImageData(D, W, H), 0, 0)

// —— 坐标网格 ——
ctx.font = '15px ui-monospace, Menlo, monospace'
ctx.textAlign = 'center'
ctx.textBaseline = 'middle'
if (GRID > 0) {
  const step = GRID
  const start = Math.ceil(gx0 / step) * step
  for (let g = start; g <= gx1 + 1e-6; g += step) {
    const vx = toPx(g, 0)[0]
    ctx.strokeStyle = 'rgba(255,120,60,0.55)'
    ctx.lineWidth = 0.8
    ctx.beginPath(); ctx.moveTo(vx, 0); ctx.lineTo(vx, H); ctx.stroke()
    ctx.fillStyle = 'rgba(255,190,120,0.95)'
    ctx.fillText(g.toFixed(3), vx, H - 20)
  }
  const startY = Math.ceil(gy0 / step) * step
  for (let g = startY; g <= gy1 + 1e-6; g += step) {
    const hy = toPx(0, g)[1]
    ctx.strokeStyle = 'rgba(90,190,255,0.55)'
    ctx.beginPath(); ctx.moveTo(0, hy); ctx.lineTo(W, hy); ctx.stroke()
    ctx.fillStyle = 'rgba(150,215,255,0.95)'
    ctx.textAlign = 'right'
    ctx.fillText(g.toFixed(3), 62, hy)
    ctx.textAlign = 'center'
  }
}

window.__PROBE__ = { bounds: { minX, maxX, minY, maxY, minZ, maxZ }, view: { gx0, gx1, gy0, gy1 } }
window.__READY__ = true
console.log('[probe] front=%d z=[%s,%s] view x[%s,%s] y[%s,%s]', front.length,
  minZ.toFixed(3), maxZ.toFixed(3), gx0, gx1, gy0, gy1)
</script>
</body>
</html>
